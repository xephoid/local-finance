name: Synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ledger, deployment, provisioning and HTTPS smoke tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Optional notifications and supervisor tests
        run: python3 -W error::ResourceWarning -m unittest test_notify test_supervise -v
